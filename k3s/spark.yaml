apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-detection
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-detection
  template:
    metadata:
      labels:
        app: spark-detection
    spec:
      containers:
        - name: spark-detection
          image: spark-detection:latest
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "msa-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: ES_HOST
              value: "http://elasticsearch.monitoring.svc.cluster.local:9200"
            - name: DOS_THRESHOLD
              value: "100"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
