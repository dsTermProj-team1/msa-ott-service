apiVersion: batch/v1
kind: Job
metadata:
  name: seed-job
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: seed
          image: simulator:latest
          imagePullPolicy: Never
          command: ["python", "seed.py"]
          env:
            - name: DATABASE_URL
              value: "postgresql://ottuser:ottpass@postgresql/ottdb"
      restartPolicy: Never
  backoffLimit: 3
