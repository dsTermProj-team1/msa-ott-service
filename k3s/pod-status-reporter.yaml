# speed-consumer(1차 집계 컨슈머)의 현재 Pod 수를 ES(msa-pod-status)로 보고하는 CronJob.
#  - 현재 replica 수: kafka ns의 speed-consumer Deployment .status.readyReplicas (실측)
#  - cron 최솟값: KEDA ScaledObject(speed-consumer-scaler)의 KST cron 트리거와 동일 매핑
#                (log-pipeline/k8s/keda/speed-consumer-scaledobject.yaml)
#  Kibana 실시간 대시보드의 "현재 Pod 수 vs cron 최솟값" 패널 데이터 소스.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-status-reporter
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-status-reporter
  namespace: kafka
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-status-reporter
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: pod-status-reporter
    namespace: kafka
roleRef:
  kind: Role
  name: pod-status-reporter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-status-reporter-script
  namespace: kafka
data:
  report.py: |
    import json, os, ssl, urllib.request
    from datetime import datetime, timezone, timedelta

    NS = "kafka"
    DEPLOY = "speed-consumer"
    ES = os.environ.get("ES_HOST", "http://elasticsearch.monitoring.svc.cluster.local:9200")
    # KEDA cron 트리거(Asia/Seoul)와 동일한 구간별 최솟값
    CRON_MIN = {"00-06": 1, "06-12": 2, "12-18": 4, "18-24": 2}

    token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ["KUBERNETES_SERVICE_PORT"]
    ctx = ssl.create_default_context(cafile=ca)
    url = f"https://{host}:{port}/apis/apps/v1/namespaces/{NS}/deployments/{DEPLOY}/status"
    req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
    st = json.load(urllib.request.urlopen(req, context=ctx, timeout=10)).get("status", {})
    ready = int(st.get("readyReplicas", 0) or 0)
    desired = int(st.get("replicas", 0) or 0)

    now = datetime.now(timezone.utc)
    kst = now + timedelta(hours=9)
    h = kst.hour
    win = "00-06" if h < 6 else "06-12" if h < 12 else "12-18" if h < 18 else "18-24"
    mn = CRON_MIN[win]

    doc = {
        "timestamp": now.isoformat(),
        "component": "speed-consumer",
        "current_replicas": ready,
        "desired_replicas": desired,
        "cron_min": mn,
        "window": win,
        "below_min": ready < mn,
    }
    data = json.dumps(doc).encode()
    r = urllib.request.Request(ES + "/msa-pod-status/_doc?refresh=true", data=data,
                               headers={"Content-Type": "application/json"}, method="POST")
    print(urllib.request.urlopen(r, timeout=10).read().decode()[:120])
    print("reported:", doc)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-status-reporter
  namespace: kafka
spec:
  schedule: "* * * * *"            # 매분
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: pod-status-reporter
          restartPolicy: Never
          containers:
            - name: reporter
              image: python:3.12-slim
              command: ["python", "/script/report.py"]
              env:
                - name: ES_HOST
                  value: "http://elasticsearch.monitoring.svc.cluster.local:9200"
              volumeMounts:
                - name: script
                  mountPath: /script
          volumes:
            - name: script
              configMap:
                name: pod-status-reporter-script
